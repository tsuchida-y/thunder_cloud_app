name: thunder_cloud_app
description: "入道雲サーチアプリ - 美しい入道雲の発生を検出・通知する観賞・撮影支援アプリ"
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 2.0.0+10

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  #cupertino_icons: ^1.0.8

  #背景に現在地を表示するためのパッケージ
  geolocator: ^13.0.4

  #通知機能を実装するためのパッケージ
  flutter_local_notifications: ^19.2.1

  #Firebase依存関係を追加
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.6
  cloud_firestore: ^5.6.8
  cloud_functions: ^5.5.1

  # カメラ・画像機能

  # UI強化
  # image_gallery_saver: ^2.0.3

  # ローカルキャッシュ機能
  shared_preferences: ^2.5.3

  google_fonts: ^8.2.1
  firebase_auth: ^5.7.0
  geocoding: ^5.0.0
  flutter_compass: ^0.8.1
  url_launcher: ^6.3.2
  purchases_flutter: ^10.17.0
  home_widget: ^0.10.0
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
