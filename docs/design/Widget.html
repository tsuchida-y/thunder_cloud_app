<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ウィジェット</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C4FA8}a:hover{color:#123A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2B3440; color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; padding: 90px 24px 24px; gap: 28px; overflow: hidden">

  <div style="display: flex; gap: 20px; align-items: flex-start">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <div style="width: 158px; height: 158px; box-sizing: border-box; border-radius: 26px; background: linear-gradient(180deg, #1C4FA8, #3A7BC8); padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <div style="font-size: 12px; font-weight: 700">入道雲</div>
          <svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44">
            <circle cx="22" cy="22" r="20" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.6"></circle>
            <text x="22" y="10" text-anchor="middle" font-family="Outfit, sans-serif" font-size="7" font-weight="600" fill="#FFFFFF">N</text>
            <circle cx="32" cy="32" r="5" fill="#FFFFFF"></circle>
            <circle cx="22" cy="22" r="2.5" fill="#FFFFFF"></circle>
          </svg>
        </div>
        <div>
          <div style="font-size: 26px; font-weight: 700">南東</div>
          <div style="font-family: Outfit, sans-serif; font-size: 15px; font-weight: 600">42km</div>
        </div>
      </div>
      <div style="font-size: 12px">小</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <div style="width: 158px; height: 158px; box-sizing: border-box; border-radius: 26px; background: linear-gradient(180deg, #2A62B8, #4F8AD0); padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
        <div style="font-size: 12px; font-weight: 700">入道雲</div>
        <div>
          <div style="font-size: 18px; font-weight: 700; line-height: 1.3">静かな空</div>
        </div>
      </div>
      <div style="font-size: 12px">小（雲がないとき）</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
    <div style="width: 342px; height: 158px; box-sizing: border-box; border-radius: 26px; background: linear-gradient(180deg, #1C4FA8, #3A7BC8); padding: 14px 16px; display: flex; gap: 14px; align-items: center">
      <svg aria-hidden="true" width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="56" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.6"></circle>
        <circle cx="60" cy="60" r="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-dasharray="2 4"></circle>
        <text x="60" y="16" text-anchor="middle" font-family="Outfit, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">N</text>
        <circle cx="79" cy="79" r="9" fill="#FFFFFF"></circle>
        <circle cx="13" cy="60" r="5" fill="none" stroke="#FFFFFF" stroke-dasharray="2 2"></circle>
        <circle cx="60" cy="60" r="4" fill="#FFFFFF"></circle>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 12px; font-weight: 700">入道雲 ・ 滝沢市</div>
        <div style="font-size: 20px; font-weight: 700">南東に入道雲</div>
        <div style="font-size: 13px">約42km先</div>
        <div style="font-size: 13px">こぶし1つ半の高さ</div>
        <div style="font-size: 12px">西にも出そう（30分後）</div>
      </div>
    </div>
    <div style="font-size: 12px">中</div>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="font-size: 13px; line-height: 1.7; text-align: center">タップするとアプリのホームが開きます。<br>Plus の機能です。</div>
</div>
</x-dc>
</body>
</html>
