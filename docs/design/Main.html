<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーム</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C4FA8}a:hover{color:#123A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #1C4FA8 0%, #3F86D6 36%, #9CCDF3 68%, #EAF5FF 100%); color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; padding: 52px 20px 20px; gap: 14px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #FFFFFF">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      <span>滝沢市の空</span>
    </div>
    <div style="display: flex">
    <a href="Record.html" aria-label="記録" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M4 15l4-4 5 5 3-3 4 4"></path></svg></a>
    <a href="Settings.html" aria-label="設定" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </a>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #1C4FA8; background: #FFFFFF; padding: 5px 12px; border-radius: 999px">
      <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1C4FA8" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v5M12 17v5M2 12h5M17 12h5M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3"></path></svg>
      いま、見えています
    </div>
    <h1 style="margin: 0; font-family: 'Zen Old Mincho', serif; font-size: 32px; font-weight: 700; line-height: 1.35; letter-spacing: 0.04em">南東の空に、<br>入道雲。</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #FFFFFF">約42km先。こぶし1つ半くらいの高さに<br>立っています。</p>
  </div>

  <div style="display: flex; justify-content: center; padding: 4px 0">
    <svg role="img" aria-label="現在地を中心にした空のレーダー。南東42kmに入道雲、西85kmに出そうな雲" width="260" height="260" viewBox="0 0 320 320">
      <circle cx="160" cy="160" r="150" fill="#14408F" fill-opacity="0.22" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.5"></circle>
      <circle cx="160" cy="160" r="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 6"></circle>
      <circle cx="160" cy="160" r="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 6"></circle>
      <text x="160" y="32" text-anchor="middle" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">N</text>
      <text x="292" y="165" text-anchor="middle" font-family="Outfit, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">E</text>
      <text x="160" y="300" text-anchor="middle" font-family="Outfit, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">S</text>
      <text x="58" y="138" text-anchor="middle" font-family="Outfit, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">W</text>
      <circle cx="74" cy="70" r="1.6" fill="#FFFFFF"></circle>
      <circle cx="250" cy="96" r="1.2" fill="#FFFFFF"></circle>
      <circle cx="96" cy="250" r="1.4" fill="#FFFFFF"></circle>
      <path d="M232 60 l2 6 l6 2 l-6 2 l-2 6 l-2-6 l-6-2 l6-2z" fill="#FFFFFF"></path>
      <line x1="160" y1="160" x2="209" y2="209" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"></line>
      <circle cx="209" cy="209" r="34" fill="#BFE3FF" fill-opacity="0.35"></circle>
      <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round">
        <line x1="209" y1="181" x2="209" y2="171"></line>
        <line x1="209" y1="237" x2="209" y2="247"></line>
        <line x1="181" y1="209" x2="171" y2="209"></line>
        <line x1="237" y1="209" x2="247" y2="209"></line>
        <line x1="189" y1="189" x2="182" y2="182"></line>
        <line x1="229" y1="189" x2="236" y2="182"></line>
        <line x1="189" y1="229" x2="182" y2="236"></line>
        <line x1="229" y1="229" x2="236" y2="236"></line>
      </g>
      <path d="M195 218 h28 a7.5 7.5 0 0 0 0-15 a10.5 10.5 0 0 0-20-2.5 a7.2 7.2 0 0 0-8 17.5z" fill="#FFFFFF"></path>
      <circle cx="22" cy="160" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="3 3"></circle>
      <circle cx="22" cy="160" r="3" fill="#FFFFFF"></circle>
      <circle cx="160" cy="160" r="14" fill="#FFFFFF" fill-opacity="0.3"></circle>
      <circle cx="160" cy="160" r="6.5" fill="#FFFFFF"></circle>
    </svg>
  </div>

  <a href="Finder.html" style="height: 56px; border-radius: 28px; background: #14408F; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 700; box-shadow: 0 8px 24px rgba(20, 64, 143, 0.3)">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
    雲の方角を調べる
  </a>

  <div style="display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.88); color: #14284A; border-radius: 22px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-bottom: 1px solid rgba(20, 40, 74, 0.08)">
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #1C4FA8; box-shadow: 0 0 0 4px rgba(28, 79, 168, 0.2)"></div>
      <div style="flex-grow: 1; font-size: 15px; font-weight: 500">南東 ・ 42km</div>
      <div style="font-size: 13px; color: #1C4FA8; font-weight: 700">14:20から見えています</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 18px">
      <div style="width: 12px; height: 12px; border-radius: 6px; border: 2px dashed #47597A; box-sizing: border-box"></div>
      <div style="flex-grow: 1; font-size: 15px; font-weight: 500">西 ・ 85km</div>
      <div style="font-size: 13px; color: #47597A">30分後に出そう ・ 見えるかも</div>
    </div>
  </div>

  <div style="text-align: center; font-size: 12px; color: #47597A">3分前に空を見ました ・ 出典：気象庁</div>
</div>
</x-dc>
</body>
</html>
