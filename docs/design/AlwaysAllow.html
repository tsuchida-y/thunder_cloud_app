<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>移動先も見張るお願い</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C4FA8}a:hover{color:#123A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #1C4FA8 0%, #3F86D6 36%, #9CCDF3 68%, #EAF5FF 100%); font-family: 'Zen Maru Gothic', sans-serif; position: relative; overflow: hidden">
  <div style="position: absolute; inset: 0; padding: 108px 20px 0; color: #FFFFFF">
    <h1 style="margin: 0; font-family: 'Zen Old Mincho', serif; font-size: 32px; font-weight: 700; line-height: 1.35; letter-spacing: 0.04em">南東の空に、<br>入道雲。</h1>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(11, 22, 48, 0.45)"></div>
  <div role="dialog" aria-labelledby="always-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; color: #14284A; border-radius: 28px 28px 0 0; padding: 14px 22px 30px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C9D6E3"></div>
    <div style="width: 52px; height: 52px; border-radius: 26px; background: #E3EEFA; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1C4FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
    </div>
    <h2 id="always-title" style="margin: 0; font-family: 'Zen Old Mincho', serif; font-size: 22px; font-weight: 700; line-height: 1.5">出かけた先の空も、<br>見張りましょうか。</h2>
    <p style="margin: 0; font-size: 15px; line-height: 1.7">いまは、最後にアプリを開いた場所（滝沢市）の空を見張っています。位置情報を「常に」にすると、移動しても、いまいる場所の空を見張れます。</p>
    <div style="background: #F4F8FC; border-radius: 16px; padding: 12px 14px; font-size: 13px; color: #47597A; line-height: 1.6">次の画面で「常に許可」を選んでください。Androidでは設定アプリが開くので、「常に許可」を選んで戻ってください。</div>
    <button type="button" style="height: 56px; border: 0; border-radius: 28px; background: #14408F; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">「常に」にする</button>
    <a href="Main.html" style="text-align: center; font-size: 15px; padding: 4px; color: #14284A">いまのままにする</a>
  </div>
</div>
</x-dc>
</body>
</html>
