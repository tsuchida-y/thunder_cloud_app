<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>方位の調整</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C4FA8}a:hover{color:#123A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #1C4FA8 0%, #3F86D6 40%, #9CCDF3 72%, #EAF5FF 100%); font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative">
  <div style="position: absolute; inset: 0; background: rgba(11, 22, 48, 0.45)"></div>
  <div style="position: relative; background: #FFFFFF; color: #14284A; border-radius: 28px 28px 0 0; padding: 28px 24px 32px; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #C9D6E3"></div>
    <h1 style="margin: 0; font-family: 'Zen Old Mincho', serif; font-size: 24px; font-weight: 700">方位がずれています</h1>
    <svg role="img" aria-label="スマホを8の字に動かす図" width="220" height="130" viewBox="0 0 220 130">
      <path d="M110 65 C80 20 30 20 30 65 C30 110 80 110 110 65 C140 20 190 20 190 65 C190 110 140 110 110 65 Z" fill="none" stroke="#1C4FA8" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"></path>
      <rect x="166" y="34" width="24" height="40" rx="5" fill="#FFFFFF" stroke="#14284A" stroke-width="2.5"></rect>
      <path d="M176 40 h4" stroke="#14284A" stroke-width="2" stroke-linecap="round"></path>
    </svg>
    <p style="margin: 0; font-size: 15px; line-height: 1.7; text-align: center">スマホを大きく8の字に、3回ほど動かしてください。磁石や金属の近くから離れると直りやすくなります。</p>
    <div style="align-self: stretch; height: 8px; border-radius: 4px; background: #E3EEFA; overflow: hidden"><div style="width: 60%; height: 8px; background: #1C4FA8"></div></div>
    <div style="font-size: 13px; color: #47597A">方位の精度: もう少し</div>
    <a href="Finder.html" style="align-self: stretch; height: 52px; border-radius: 26px; border: 1.5px solid #14408F; color: #14408F; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">このまま続ける</a>
  </div>
</div>
</x-dc>
