<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>通知</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Outfit:wght@300;400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C4FA8}a:hover{color:#123A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #1C4FA8 0%, #3F86D6 45%, #9CCDF3 75%, #EAF5FF 100%); color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 90px 14px 28px; gap: 12px; overflow: hidden; position: relative">
  <div style="font-size: 17px; font-weight: 500">8月12日 火曜日</div>
  <div style="font-family: Outfit, sans-serif; font-size: 84px; font-weight: 300; line-height: 1">15:24</div>

  <svg aria-hidden="true" width="360" height="200" viewBox="0 0 360 200" style="margin: 10px 0 6px">
    <circle cx="180" cy="110" r="96" fill="#BFE3FF" fill-opacity="0.22"></circle>
    <path d="M70 190 C60 160 90 140 112 148 C110 110 150 96 168 116 C170 70 220 56 236 96 C262 84 292 108 280 140 C310 142 318 176 300 190 Z" fill="#FFFFFF" fill-opacity="0.92"></path>
    <path d="M60 30 l2.5 7 l7 2.5 l-7 2.5 l-2.5 7 l-2.5-7 l-7-2.5 l7-2.5z" fill="#FFFFFF"></path>
    <path d="M300 48 l2 5 l5 2 l-5 2 l-2 5 l-2-5 l-5-2 l5-2z" fill="#FFFFFF"></path>
    <circle cx="110" cy="60" r="1.6" fill="#FFFFFF"></circle>
    <circle cx="270" cy="26" r="1.3" fill="#FFFFFF"></circle>
  </svg>

  <div style="align-self: stretch; background: rgba(255, 255, 255, 0.92); color: #14284A; border-radius: 22px; padding: 14px 16px; display: flex; gap: 12px">
    <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 10px; background: linear-gradient(180deg, #1C4FA8, #7FC0F5); display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M6 18h11a4 4 0 0 0 0-8a6 6 0 0 0-11.4-1.6A4.5 4.5 0 0 0 6 18z" fill="#FFFFFF"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #47597A"><span>入道雲サーチ</span><span>いま</span></div>
      <div style="font-size: 15px; font-weight: 700">南東の空に、入道雲が現れました</div>
      <div style="font-size: 14px; line-height: 1.55">約42km先。こぶし1つ半の高さを見上げてみて。</div>
      <div style="font-size: 12px; color: #47597A; margin-top: 6px">通知を長押しすると出るボタン</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
        <button type="button" style="height: 40px; border: 0; border-radius: 12px; background: #E3EEFA; color: #14284A; font-family: inherit; font-size: 14px; font-weight: 700">見えた</button>
        <button type="button" style="height: 40px; border: 0; border-radius: 12px; background: #E3EEFA; color: #14284A; font-family: inherit; font-size: 14px; font-weight: 700">見えなかった</button>
      </div>
    </div>
  </div>

  <div style="align-self: stretch; background: rgba(255, 255, 255, 0.82); color: #14284A; border-radius: 22px; padding: 14px 16px; display: flex; gap: 12px">
    <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 10px; background: linear-gradient(180deg, #1C4FA8, #7FC0F5); display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M6 18h11a4 4 0 0 0 0-8a6 6 0 0 0-11.4-1.6A4.5 4.5 0 0 0 6 18z" fill="#FFFFFF"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #47597A"><span>入道雲サーチ</span><span>14:50</span></div>
      <div style="font-size: 15px; font-weight: 700">西の空に、入道雲が出そうです</div>
      <div style="font-size: 14px; line-height: 1.55">気象庁の予測では30分後くらい。約85km先なので、見えるかもしれません。</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
