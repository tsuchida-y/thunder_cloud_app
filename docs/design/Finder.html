<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>方角ガイド</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C4FA8}a:hover{color:#123A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #1C4FA8 0%, #3F86D6 40%, #9CCDF3 72%, #EAF5FF 100%); color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 28px; gap: 18px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 4px">
    <a href="Main.html" aria-label="ホームに戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -10px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="font-size: 16px; font-weight: 700">南東の入道雲へ</div>
  </div>

  <div style="background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 18px; padding: 10px 0 6px">
    <svg role="img" aria-label="方位テープ。いまは東を向いていて、入道雲は右に35度の南東" width="348" height="58" viewBox="0 0 350 58">
      <g stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round">
        <line x1="15" y1="22" x2="15" y2="30"></line>
        <line x1="55" y1="22" x2="55" y2="30"></line>
        <line x1="95" y1="22" x2="95" y2="30"></line>
        <line x1="215" y1="22" x2="215" y2="30"></line>
        <line x1="255" y1="22" x2="255" y2="30"></line>
        <line x1="295" y1="22" x2="295" y2="30"></line>
        <line x1="335" y1="22" x2="335" y2="30"></line>
      </g>
      <line x1="135" y1="18" x2="135" y2="30" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></line>
      <text x="135" y="48" text-anchor="middle" font-family="Zen Maru Gothic, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">東</text>
      <text x="55" y="48" text-anchor="middle" font-family="Outfit, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.85">70°</text>
      <text x="255" y="48" text-anchor="middle" font-family="Outfit, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.85">120°</text>
      <circle cx="315" cy="14" r="13" fill="#BFE3FF" fill-opacity="0.5"></circle>
      <path d="M308 19 h14 a4 4 0 0 0 0-8 a5.5 5.5 0 0 0-10.5-1.4 a3.8 3.8 0 0 0-3.5 9.4z" fill="#FFFFFF"></path>
      <text x="315" y="48" text-anchor="middle" font-family="Zen Maru Gothic, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">南東</text>
      <path d="M175 2 L169 12 L181 12 Z" fill="#FFFFFF"></path>
      <line x1="175" y1="12" x2="175" y2="34" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"></line>
    </svg>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px">
    <svg role="img" aria-label="右へ35度回るよう示す矢印" width="210" height="210" viewBox="0 0 210 210">
      <circle cx="105" cy="105" r="98" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"></circle>
      <path d="M105 7 A98 98 0 0 1 161 25" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"></path>
      <g transform="rotate(35 105 105)">
        <path d="M105 30 L136 84 L116 78 L116 160 Q116 168 105 168 Q94 168 94 160 L94 78 L74 84 Z" fill="#FFFFFF"></path>
      </g>
      <path d="M176 40 l2 6 l6 2 l-6 2 l-2 6 l-2-6 l-6-2 l6-2z" fill="#FFFFFF"></path>
      <circle cx="40" cy="58" r="1.6" fill="#FFFFFF"></circle>
      <circle cx="170" cy="168" r="1.4" fill="#FFFFFF"></circle>
    </svg>
    <div style="font-family: 'Zen Old Mincho', serif; font-size: 34px; font-weight: 700; margin-top: 6px">右へ <span style="font-family: Outfit, sans-serif; font-weight: 600">35°</span></div>
    <div style="font-size: 15px">ゆっくり、体ごと右を向いて</div>
  </div>

  <div style="background: rgba(255, 255, 255, 0.9); color: #14284A; border-radius: 22px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 14px; font-weight: 700">見上げる高さ</div>
    <svg role="img" aria-label="地平線から約16度上に入道雲が見える" width="306" height="100" viewBox="0 0 316 104">
      <line x1="10" y1="88" x2="306" y2="88" stroke="#47597A" stroke-opacity="0.5" stroke-width="1.5"></line>
      <text x="306" y="103" text-anchor="end" font-family="Zen Maru Gothic, sans-serif" font-size="11" fill="#47597A">地平線</text>
      <circle cx="22" cy="82" r="5" fill="#1C4FA8"></circle>
      <line x1="22" y1="82" x2="250" y2="17" stroke="#1C4FA8" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"></line>
      <path d="M70 82 A48 48 0 0 0 68 69" fill="none" stroke="#14284A" stroke-width="1.5"></path>
      <text x="78" y="77" font-family="Outfit, sans-serif" font-size="12" font-weight="600" fill="#14284A">16°</text>
      <circle cx="270" cy="30" r="26" fill="#BFE3FF" fill-opacity="0.35"></circle>
      <path d="M250 42 h40 a12 12 0 0 0 0-24 a17 17 0 0 0-32-4 a12 12 0 0 0-8 28z" fill="#FFFFFF" stroke="#1C4FA8" stroke-width="1.5"></path>
      <rect x="264" y="43" width="12" height="45" fill="#1C4FA8" fill-opacity="0.18"></rect>
    </svg>
    <div style="font-size: 14px; color: #47597A; line-height: 1.6">腕を伸ばして、こぶし1つ半くらい上。</div>
  </div>

</div>
</x-dc>
</body>
</html>
