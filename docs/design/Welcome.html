<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>はじめての起動</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C4FA8}a:hover{color:#123A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #1C4FA8 0%, #3F86D6 38%, #9CCDF3 66%, #EAF5FF 100%); color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; padding: 96px 20px 28px; gap: 16px; overflow: hidden">

  <svg aria-hidden="true" width="120" height="70" viewBox="0 0 120 70">
    <path d="M14 66 C8 52 22 42 34 46 C32 26 56 18 66 32 C70 10 98 8 102 32 C116 32 120 54 108 66 Z" fill="#FFFFFF"></path>
    <path d="M10 10 l2 6 l6 2 l-6 2 l-2 6 l-2-6 l-6-2 l6-2z" fill="#FFFFFF"></path>
  </svg>

  <h1 style="margin: 0; font-family: 'Zen Old Mincho', serif; font-size: 34px; font-weight: 700; letter-spacing: 0.04em">入道雲サーチ</h1>
  <p style="margin: 0; font-size: 16px; line-height: 1.7">あなたの場所から見える空に入道雲が現れたら、どの方角かをお知らせします。</p>

  <div style="flex-grow: 1"></div>

  <div style="background: rgba(255, 255, 255, 0.92); color: #14284A; border-radius: 22px; display: flex; flex-direction: column">
    <div style="display: flex; gap: 14px; padding: 16px 18px; border-bottom: 1px solid rgba(20, 40, 74, 0.08)">
      <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: #E3EEFA; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C4FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <div style="font-size: 15px; font-weight: 700">位置情報（アプリの使用中）</div>
        <div style="font-size: 13px; color: #47597A; line-height: 1.6">開いた場所の空を調べ、その場所の空を見張ります。</div>
      </div>
    </div>
    <div style="display: flex; gap: 14px; padding: 16px 18px">
      <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: #E3EEFA; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C4FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <div style="font-size: 15px; font-weight: 700">通知</div>
        <div style="font-size: 13px; color: #47597A; line-height: 1.6">入道雲が見えたときに、1つの雲につき1回だけお知らせします。</div>
      </div>
    </div>
  </div>

  <button type="button" style="height: 56px; border: 0; border-radius: 28px; background: #14408F; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; box-shadow: 0 8px 24px rgba(20, 64, 143, 0.3)">許可してはじめる</button>
  <div style="text-align: center; font-size: 13px; color: #47597A; line-height: 1.6">移動先の空も見張る設定は、あとでご案内します。</div>
  <a href="Main.html" style="text-align: center; font-size: 14px; padding: 6px; color: #14284A">あとで設定する</a>
</div>
</x-dc>
</body>
</html>
