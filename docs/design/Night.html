<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>夜</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#BFE3FF}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #0B1630 0%, #14295A 55%, #24427E 100%); color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 16px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 6px; font-size: 14px">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      <span>滝沢市の空</span>
    </div>
    <a href="Settings.html" aria-label="設定" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="align-self: flex-start; font-size: 12px; font-weight: 700; color: #14295A; background: #BFE3FF; padding: 5px 12px; border-radius: 999px">見張りはお休み中</div>
    <h1 style="margin: 0; font-family: 'Zen Old Mincho', serif; font-size: 30px; font-weight: 700; line-height: 1.4; letter-spacing: 0.04em">いまは夜。<br>空が暗くて見えません。</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.7">あすの朝 5:10 ごろ、明るくなったら見張りを再開します。夜のあいだは通知しません。</p>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="260" height="220" viewBox="0 0 260 220">
      <path d="M170 40 a50 50 0 1 0 40 80 a40 40 0 0 1 -40 -80z" fill="#FFF4D6"></path>
      <circle cx="40" cy="30" r="2" fill="#FFFFFF"></circle>
      <circle cx="80" cy="80" r="1.5" fill="#FFFFFF"></circle>
      <circle cx="230" cy="40" r="1.6" fill="#FFFFFF"></circle>
      <circle cx="30" cy="140" r="1.4" fill="#FFFFFF"></circle>
      <circle cx="120" cy="20" r="1.2" fill="#FFFFFF"></circle>
      <path d="M60 110 l2 6 l6 2 l-6 2 l-2 6 l-2-6 l-6-2 l6-2z" fill="#FFFFFF"></path>
      <path d="M10 220 C10 196 34 186 50 192 C54 170 84 166 94 184 C110 172 136 182 134 204 C150 202 164 212 164 220 Z" fill="#FFFFFF" fill-opacity="0.12"></path>
    </svg>
  </div>

  <div style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 22px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 14px; font-weight: 700">きょう見えた入道雲</div>
    <div style="font-size: 14px; line-height: 1.7">14:20 から 15:40 まで、南東の空（約42km先）</div>
  </div>
</div>
</x-dc>
</body>
</html>
