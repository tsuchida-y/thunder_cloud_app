<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>方角ガイド（合ったとき）</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C4FA8}a:hover{color:#123A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #1C4FA8 0%, #3F86D6 40%, #9CCDF3 72%, #EAF5FF 100%); color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 28px; gap: 16px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 4px">
    <a href="Main.html" aria-label="ホームに戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -10px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="font-size: 16px; font-weight: 700">南東の入道雲へ</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 8px">
    <svg role="img" aria-label="向きが合いました。正面に入道雲があります" width="210" height="210" viewBox="0 0 210 210">
      <circle cx="105" cy="105" r="98" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-width="4"></circle>
      <circle cx="105" cy="105" r="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="2 6"></circle>
      <path d="M66 128 h78 a20 20 0 0 0 0-40 a28 28 0 0 0-53-7 a19 19 0 0 0-25 47z" fill="#FFFFFF"></path>
      <path d="M176 36 l2 6 l6 2 l-6 2 l-2 6 l-2-6 l-6-2 l6-2z" fill="#FFFFFF"></path>
      <path d="M30 150 l1.6 4.4 l4.4 1.6 l-4.4 1.6 l-1.6 4.4 l-1.6-4.4 l-4.4-1.6 l4.4-1.6z" fill="#FFFFFF"></path>
    </svg>
    <div style="font-family: 'Zen Old Mincho', serif; font-size: 34px; font-weight: 700; margin-top: 4px">この方向です</div>
    <div style="font-size: 15px; line-height: 1.7; text-align: center">正面の空、こぶし1つ半くらい上を<br>見上げてみてください。</div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="background: rgba(255, 255, 255, 0.92); color: #14284A; border-radius: 22px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 15px; font-weight: 700">入道雲は見えましたか？</div>
    <div style="font-size: 13px; color: #47597A; line-height: 1.6">教えてもらうと、お知らせの精度が上がります。</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 44px; border: 0; border-radius: 14px; background: #E3EEFA; color: #14284A; font-family: inherit; font-size: 15px; font-weight: 700">見えた</button>
      <button type="button" style="height: 44px; border: 0; border-radius: 14px; background: #E3EEFA; color: #14284A; font-family: inherit; font-size: 15px; font-weight: 700">見えなかった</button>
    </div>
  </div>

  <a href="Record.html" style="height: 56px; border-radius: 28px; background: #14408F; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 24px rgba(20, 64, 143, 0.3)">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
    写真を撮る
  </a>
</div>
</x-dc>
</body>
</html>
