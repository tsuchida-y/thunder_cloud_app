<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>通信できないとき</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C4FA8}a:hover{color:#123A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #4E6E96 0%, #7C9BBE 40%, #C4D5E6 72%, #EEF3F8 100%); color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 28px; gap: 16px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; height: 44px">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
    <span>滝沢市の空</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="align-self: flex-start; font-size: 12px; font-weight: 700; color: #2F4766; background: #FFFFFF; padding: 5px 12px; border-radius: 999px">オフライン</div>
    <h1 style="margin: 0; font-family: 'Zen Old Mincho', serif; font-size: 30px; font-weight: 700; line-height: 1.4; letter-spacing: 0.04em">空の情報が<br>受け取れません。</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.7">電波の届く場所で、もう一度読み込んでください。</p>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="200" height="160" viewBox="0 0 200 160">
      <path d="M30 130 C20 110 40 96 56 102 C56 76 92 66 104 88 C112 62 152 62 156 94 C176 94 186 118 172 130 Z" fill="#FFFFFF" fill-opacity="0.85"></path>
      <line x1="48" y1="56" x2="160" y2="150" stroke="#4E6E96" stroke-width="12" stroke-linecap="round"></line>
      <line x1="48" y1="56" x2="160" y2="150" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"></line>
    </svg>
  </div>

  <div style="background: rgba(255, 255, 255, 0.9); color: #14284A; border-radius: 22px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 13px; color: #47597A">最後に見た空（15:21）</div>
    <div style="font-size: 15px; font-weight: 700">南東の空に入道雲（約42km先）</div>
    <div style="font-size: 13px; color: #47597A; line-height: 1.6">いまも見えるかは分かりません。</div>
  </div>

  <button type="button" style="height: 56px; border: 0; border-radius: 28px; background: #14408F; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">もう一度読み込む</button>
</div>
</x-dc>
</body>
</html>
