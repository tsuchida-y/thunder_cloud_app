<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>場所の登録</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C4FA8}a:hover{color:#123A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #DCEBFA 0%, #F4F8FC 40%, #EEF6FF 100%); color: #14284A; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 14px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 4px">
    <a href="Settings.html" aria-label="設定に戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -10px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14284A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="font-size: 16px; font-weight: 700">見張る場所</div>
  </div>

  <div style="font-size: 14px; color: #47597A; line-height: 1.7; padding: 0 4px">いまいる場所に加えて、よく行く場所を3か所まで見張れます。</div>

  <div style="background: #FFFFFF; border-radius: 22px; box-shadow: 0 2px 12px rgba(28, 79, 168, 0.06); display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #E6ECF2">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C4FA8" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 500">いまいる場所</div><div style="font-size: 13px; color: #47597A">滝沢市</div></div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #E6ECF2">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C4FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"></path></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 500">家</div><div style="font-size: 13px; color: #47597A">盛岡市</div></div>
      <a href="#" style="font-size: 14px; padding: 10px 4px">変更</a>
      <button type="button" aria-label="この場所を削除" style="width: 40px; height: 40px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#47597A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C4FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2"></rect><path d="M9 7V4h6v3"></path></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 500">学校</div><div style="font-size: 13px; color: #47597A">滝沢市</div></div>
      <a href="#" style="font-size: 14px; padding: 10px 4px">変更</a>
      <button type="button" aria-label="この場所を削除" style="width: 40px; height: 40px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#47597A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
    </div>
  </div>

  <button type="button" style="height: 52px; border: 1.5px dashed #1C4FA8; border-radius: 22px; background: transparent; color: #1C4FA8; font-family: inherit; font-size: 15px; font-weight: 700">＋ 場所を追加（あと1か所）</button>

  <div style="background: #FFFFFF; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 12px rgba(28, 79, 168, 0.06)">
    <label for="place-search" style="font-size: 14px; font-weight: 700">場所をさがす</label>
    <input id="place-search" type="text" placeholder="市町村名や住所" style="height: 44px; border: 1.5px solid #C9D6E3; border-radius: 12px; padding: 0 12px; font-family: inherit; font-size: 15px; color: #14284A; background: #F7FAFD">
  </div>

  <div style="flex-grow: 1"></div>
  <div style="font-size: 12px; color: #47597A; text-align: center; line-height: 1.6">無料プランは「いまいる場所」か、手で選んだ1か所です。<br>3か所の登録は <a href="Plus.html">Plus</a> の機能です。</div>
</div>
</x-dc>
</body>
</html>
