<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C4FA8}a:hover{color:#123A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #DCEBFA 0%, #F4F8FC 40%, #EEF6FF 100%); color: #14284A; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 14px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 4px">
    <a href="Main.html" aria-label="ホームに戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -10px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14284A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="font-size: 16px; font-weight: 700">設定</div>
  </div>

  <div style="font-size: 13px; color: #47597A; font-weight: 700; padding: 6px 4px 0">通知</div>
  <div style="background: #FFFFFF; border: 0; border-radius: 22px; box-shadow: 0 2px 12px rgba(28, 79, 168, 0.06); display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 15px; font-weight: 500">入道雲が見えたら知らせる</div>
      </div>
      <button type="button" aria-pressed="true" aria-label="入道雲が見えたら知らせる" style="width: 52px; height: 32px; border: 0; border-radius: 16px; background: #14408F; padding: 3px; display: flex; justify-content: flex-end"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; display: block"></span></button>
    </div>
  </div>

  <div style="font-size: 13px; color: #47597A; font-weight: 700; padding: 6px 4px 0">どこまでの空を見守るか</div>
  <div style="background: #FFFFFF; border: 0; border-radius: 22px; box-shadow: 0 2px 12px rgba(28, 79, 168, 0.06); padding: 6px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
    <button type="button" aria-pressed="true" style="height: 44px; border: 0; border-radius: 14px; background: #1C4FA8; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700">30km</button>
    <a href="Plus.html" style="height: 44px; border-radius: 12px; color: #14284A; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>90km（Plus）</a>
  </div>
  <div style="font-size: 13px; color: #47597A; padding: 0 4px; line-height: 1.6">60kmより遠い雲は「見えるかもしれません」とお知らせします。山や建物で隠れることもあります。</div>

  <div style="font-size: 13px; color: #47597A; font-weight: 700; padding: 6px 4px 0">そのほか</div>
  <div style="background: #FFFFFF; border: 0; border-radius: 22px; box-shadow: 0 2px 12px rgba(28, 79, 168, 0.06); display: flex; flex-direction: column">
    <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #E6ECF2; color: #14284A; text-decoration: none">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">通知しない時間</span><span style="font-size: 12px; color: #47597A">夜（日没〜日の出）は自動で休みます</span></span>
      <span style="font-size: 14px; color: #47597A">22:00〜6:00</span>
    </a>
    <a href="Record.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #E6ECF2; color: #14284A; text-decoration: none">
      <span style="flex-grow: 1; font-size: 15px">記録（見えた雲）</span>
      <span style="font-size: 14px; color: #47597A">12日</span>
    </a>
    <a href="Places.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; color: #14284A; text-decoration: none">
      <span style="flex-grow: 1; font-size: 15px">見張る場所</span>
      <span style="font-size: 14px; color: #47597A">いまいる場所</span>
    </a>
  </div>
  <a href="Plus.html" style="display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 22px; background: #14408F; color: #FFFFFF; text-decoration: none">
    <span style="flex-grow: 1; font-size: 15px; font-weight: 700">Plus で、もっと遠くまで見張る</span>
    <span style="font-size: 13px">7日間無料</span>
  </a>
</div>
</x-dc>
</body>
</html>
