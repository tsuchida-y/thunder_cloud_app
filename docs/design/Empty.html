<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーム（雲がないとき）</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C4FA8}a:hover{color:#123A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #2A62B8 0%, #5C9BDD 36%, #BFE0F7 68%, #F0F8FF 100%); color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 16px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 6px; font-size: 14px">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      <span>滝沢市の空</span>
    </div>
    <div style="display: flex">
    <a href="Record.html" aria-label="記録" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M4 15l4-4 5 5 3-3 4 4"></path></svg></a>
    <a href="Settings.html" aria-label="設定" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </a>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="align-self: flex-start; font-size: 12px; font-weight: 700; color: #14284A; background: rgba(255, 255, 255, 0.85); padding: 5px 12px; border-radius: 999px">空を見守っています</div>
    <h1 style="margin: 0; font-family: 'Zen Old Mincho', serif; font-size: 30px; font-weight: 700; line-height: 1.4; letter-spacing: 0.04em">いまは、<br>静かな空です。</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.7">入道雲が現れたら、すぐにお知らせします。</p>
  </div>

  <div style="display: flex; justify-content: center; padding-top: 24px">
    <svg role="img" aria-label="空のレーダー。雲は見つかっていません" width="280" height="280" viewBox="0 0 320 320">
      <circle cx="160" cy="160" r="150" fill="#14408F" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="1.5"></circle>
      <circle cx="160" cy="160" r="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 6"></circle>
      <circle cx="160" cy="160" r="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 6"></circle>
      <text x="160" y="36" text-anchor="middle" font-family="Outfit, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">N</text>
      <circle cx="90" cy="96" r="2" fill="#FFFFFF" fill-opacity="0.8"></circle>
      <circle cx="240" cy="210" r="1.6" fill="#FFFFFF" fill-opacity="0.8"></circle>
      <circle cx="160" cy="160" r="16" fill="#FFFFFF" fill-opacity="0.3"></circle>
      <circle cx="160" cy="160" r="8" fill="#FFFFFF"></circle>
    </svg>
  </div>

  <!-- レーダーには、見張っていることが分かるよう、光の筋（白の透明度0→22%の扇、60°）を6秒で1周させる。動きを減らす設定の人には回さない（2026-10-27） -->
  <!-- 背景: 太陽が10°より低い朝や夕方は #2B4F9C → #5A7CC6 → #B7C3EA → #F2EEF8 にする（オレンジは使わない。2026-10-27） -->

  <div style="flex-grow: 1"></div>

  <!-- いまの空と、いちばん近い入道雲（2026-10-27）。静かな空のあいだも開くたびに変わる。どちらも、いまの観測。
       押せる所と間違えないよう、アイコンや「›」は付けない。レーダーは見出しとこのカードの間の真ん中に置く -->
  <div style="background: rgba(255, 255, 255, 0.94); border-radius: 22px; color: #14284A">
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 18px; border-bottom: 1px solid #E3EAF2">
      <div style="font-size: 13px; color: #47597A">いまの空</div>
      <div style="font-size: 15px">日が差しています ・ 気温24℃ ・ 見通し20km以上</div>
      <div style="font-size: 12px; color: #47597A">近くのアメダス 14:20</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 18px">
      <div style="font-size: 13px; color: #47597A">いちばん近い入道雲</div>
      <!-- 全国にないときは「全国で見つかっていません」（紺の普通の字）で、下の「全国で○か所」は出さない。地名が分からない海の上の雲は（〜のあたり）を付けない -->
      <div style="font-size: 15px; font-weight: 700; color: #1C4FA8">北西 210km（秋田市のあたり）</div>
      <div style="font-size: 12px; color: #47597A">全国で3か所</div>
    </div>
  </div>

  <div style="text-align: center; font-size: 12px; color: #47597A">1分前に空を見ました ・ 出典：気象庁</div>
</div>
</x-dc>
</body>
</html>
