<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Plus のご案内</title>
<style>x-dc,helmet{display:block}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C4FA8}a:hover{color:#123A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #1C4FA8 0%, #3F86D6 30%, #9CCDF3 56%, #EAF5FF 78%); color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; padding: 48px 20px 20px; gap: 12px; overflow: hidden">

  <div style="display: flex; justify-content: flex-end">
    <a href="Settings.html" aria-label="閉じる" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-family: Outfit, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.1em">PLUS</div>
    <h1 style="margin: 0; font-family: 'Zen Old Mincho', serif; font-size: 28px; font-weight: 700; line-height: 1.4">もっと遠くの入道雲を、<br>もっと早く。</h1>
  </div>

  <div style="background: rgba(255, 255, 255, 0.94); color: #14284A; border-radius: 22px; padding: 6px 18px; display: flex; flex-direction: column">
    <div style="display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(20, 40, 74, 0.08)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C4FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 700">30分前に予告</div><div style="font-size: 13px; color: #47597A">出そうなときに先にお知らせ</div></div>
    </div>
    <div style="display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(20, 40, 74, 0.08)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C4FA8" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.5"></circle></svg>
      <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 700">90km先まで見張る</div><div style="font-size: 13px; color: #47597A">無料は30kmまで</div></div>
    </div>
    <div style="display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(20, 40, 74, 0.08)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C4FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 700">いまいる場所＋3か所</div><div style="font-size: 13px; color: #47597A">家や学校、職場の空も見張る</div></div>
    </div>
    <div style="display: flex; gap: 12px; padding: 12px 0">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C4FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M4 15l4-4 5 5 3-3 4 4"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 700">ウィジェットと写真の共有</div><div style="font-size: 13px; color: #47597A">方角と距離を入れてSNSへ</div></div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button type="button" aria-pressed="true" style="border: 2px solid #14408F; border-radius: 18px; background: #FFFFFF; color: #14284A; font-family: inherit; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: #14408F; border-radius: 999px; padding: 2px 8px">おすすめ</span>
      <span style="font-size: 15px; font-weight: 700">年額 1,200円</span>
      <span style="font-size: 12px; color: #47597A">月あたり100円</span>
    </button>
    <button type="button" aria-pressed="false" style="border: 1.5px solid #C9D6E3; border-radius: 18px; background: #FFFFFF; color: #14284A; font-family: inherit; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
      <span style="font-size: 15px; font-weight: 700">月額 200円</span>
      <span style="font-size: 12px; color: #47597A">いつでも解約できます</span>
    </button>
  </div>

  <button type="button" style="height: 60px; border: 0; border-radius: 30px; background: #14408F; color: #FFFFFF; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px"><span style="font-size: 17px; font-weight: 700">7日間 無料で試す</span><span style="font-size: 12px">そのあと年額1,200円（自動更新）</span></button>
  <div style="text-align: center; font-size: 12px; color: #47597A; line-height: 1.6">終了24時間前までの解約なら、料金はかかりません。<br>更新はストアの設定からいつでも止められます。<br><a href="#">購入を復元</a> ・ <a href="#">利用規約</a> ・ <a href="#">プライバシー</a></div>
</div>
</x-dc>
</body>
</html>
